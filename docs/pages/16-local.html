<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://unpkg.com" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      * {
        scrollbar-width: none;
      }
      @keyframes thinkDot {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @keyframes turnPulse {
        0%,
        100% {
          box-shadow:
            0 0 0 2px rgba(212, 168, 67, 0.55),
            0 0 14px rgba(212, 168, 67, 0.35);
        }
        50% {
          box-shadow:
            0 0 0 3px rgba(212, 168, 67, 0.9),
            0 0 26px rgba(212, 168, 67, 0.6);
        }
      }
      @keyframes lastGlow {
        0%,
        100% {
          box-shadow:
            0 0 0 2px #d4a843,
            0 0 10px rgba(212, 168, 67, 0.45);
        }
        50% {
          box-shadow:
            0 0 0 2px #e8c96a,
            0 0 26px rgba(212, 168, 67, 0.85);
        }
      }
      .stone-b {
        background: radial-gradient(circle at 35% 30%, #4a4a4a, #0a0a0a 62%);
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.55),
          inset 0 1px 2px rgba(255, 255, 255, 0.14);
      }
      .stone-w {
        background: radial-gradient(circle at 35% 30%, #ffffff, #c9ced6 68%);
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.45),
          inset 0 -1px 2px rgba(0, 0, 0, 0.12);
      }
      .board-cell {
        background: linear-gradient(135deg, #1a6b3c, #17613a);
        border: 1px solid rgba(0, 0, 0, 0.28);
      }
      .board-cell.legal {
        cursor: pointer;
      }
      .board-cell.legal:hover::after {
        content: '';
        position: absolute;
        inset: 22%;
        border-radius: 9999px;
        border: 2px dashed rgba(212, 168, 67, 0.7);
      }
      .board-cell {
        position: relative;
      }
    </style>
  </head>

  <body
    class="bg-[#0f1117] min-h-screen text-[#f0f0f0]"
    style="font-family: 'DM Sans', system-ui, sans-serif"
  >
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #0f1117;
        --color-board-green: #1a6b3c;
        --color-board-dark: #145a30;
        --color-gold: #d4a843;
        --color-gold-light: #e8c96a;
        --color-glass: rgba(255, 255, 255, 0.05);
        --color-glass-border: rgba(255, 255, 255, 0.1);
        --color-text-primary: #f0f0f0;
        --color-text-secondary: #8a8f98;
        --color-surface: #161922;
      }
    </style>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=DM+Sans:wght@400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap"
    />

    <!-- 顶栏：Logo + 离线练习标题 + 不计分 badge + 返回出口 -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 h-16 backdrop-blur-xl bg-[rgba(15,17,23,0.85)] border-b border-glass-border"
    >
      <div class="max-w-[1440px] mx-auto h-full px-8 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="/" class="flex items-center gap-3 cursor-pointer group">
            <div
              class="w-9 h-9 rounded-lg bg-gradient-to-br from-board-green to-[#0d4a28] flex items-center justify-center"
            >
              <div class="grid grid-cols-2 gap-0.5">
                <div class="w-2.5 h-2.5 rounded-full bg-black"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-white"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-white"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-black"></div>
              </div>
            </div>
            <span class="text-lg font-bold tracking-wide group-hover:text-gold transition-colors"
              >Othello</span
            >
          </a>
          <span class="hidden sm:block text-sm font-semibold text-text-secondary">·</span>
          <span class="hidden sm:block text-sm font-semibold">离线练习</span>
          <span
            class="text-[9px] px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-medium"
            >不计分</span
          >
        </div>
        <div class="flex items-center gap-2">
          <a
            href="/"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs text-text-secondary hover:text-gold hover:bg-glass transition-all"
          >
            <i data-lucide="home" class="w-3.5 h-3.5"></i
            ><span class="hidden sm:inline">回首页</span>
          </a>
          <a
            href="/lobby"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs text-text-secondary hover:text-gold hover:bg-glass transition-all"
          >
            <i data-lucide="users" class="w-3.5 h-3.5"></i
            ><span class="hidden sm:inline">回大厅</span>
          </a>
        </div>
      </div>
    </nav>

    <main class="pt-16 min-h-screen relative overflow-hidden">
      <!-- 氛围层 -->
      <div
        class="absolute top-1/3 left-[-10%] w-[600px] h-[600px] rounded-full bg-board-green/12 blur-[130px] pointer-events-none"
      ></div>
      <div
        class="absolute bottom-[-15%] right-[-6%] w-[480px] h-[480px] rounded-full bg-gold/8 blur-[120px] pointer-events-none"
      ></div>
      <div
        class="absolute inset-0 opacity-[0.03] pointer-events-none"
        style="
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
          background-size: 56px 56px;
        "
      ></div>

      <div
        class="max-w-[1440px] mx-auto px-8 min-h-[calc(100vh-4rem)] flex flex-col lg:flex-row relative"
      >
        <!-- 左：棋盘（居中） -->
        <div class="flex-1 flex items-center justify-center py-8">
          <div
            class="relative rounded-2xl p-3 bg-gradient-to-br from-[#0d4a28] to-[#0a3a20] border border-board-green/40 shadow-[0_24px_80px_rgba(0,0,0,0.5)]"
          >
            <div
              id="local-board"
              class="grid grid-cols-8 rounded-lg overflow-hidden aspect-square"
              style="width: min(62vh, 560px)"
            ></div>
            <!-- 最后一手标注 -->
            <div
              class="absolute top-5 right-5 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[rgba(15,17,23,0.82)] border border-gold/40 backdrop-blur-sm"
            >
              <span class="w-2 h-2 rounded-full bg-gold"></span>
              <span class="text-[10px] text-gold" style="font-family: 'Space Mono', monospace"
                >最后一手 · D3</span
              >
            </div>
          </div>
        </div>

        <!-- 右：侧栏 -->
        <aside
          class="w-full lg:w-72 p-5 flex flex-col gap-4 lg:border-l border-glass-border overflow-y-auto"
        >
          <!-- 比分卡 -->
          <div class="backdrop-blur-xl bg-glass border border-glass-border rounded-2xl p-5">
            <div class="flex items-center justify-between mb-4">
              <span class="text-[10px] uppercase tracking-wider text-text-secondary">比分</span>
              <span
                class="text-[10px] text-text-secondary"
                style="font-family: 'Space Mono', monospace"
                >第 23 手</span
              >
            </div>
            <div class="flex items-center justify-between">
              <!-- 黑（你）—— 当前回合，金色脉冲环 -->
              <div class="flex items-center gap-3">
                <div
                  class="w-11 h-11 rounded-full stone-b"
                  style="animation: turnPulse 1.8s ease-in-out infinite"
                ></div>
                <div>
                  <p class="text-[11px] text-text-secondary">你（黑）</p>
                  <p class="text-2xl font-black font-mono leading-none mt-1">14</p>
                </div>
              </div>
              <span class="text-text-secondary text-xs font-mono">vs</span>
              <!-- 白（AI） -->
              <div class="flex items-center gap-3">
                <div>
                  <p class="text-[11px] text-text-secondary text-right">AI（白）</p>
                  <p class="text-2xl font-black font-mono leading-none mt-1 text-right">9</p>
                </div>
                <div class="w-11 h-11 rounded-full stone-w"></div>
              </div>
            </div>
          </div>

          <!-- 回合状态卡 -->
          <div
            class="backdrop-blur-xl bg-gold/5 border border-gold/25 rounded-2xl p-4 flex items-center gap-3"
          >
            <div
              class="w-9 h-9 rounded-full stone-b shrink-0"
              style="animation: turnPulse 1.8s ease-in-out infinite"
            ></div>
            <div>
              <p class="text-sm font-bold text-gold">你的回合</p>
              <p class="text-[10px] text-text-secondary mt-0.5">点击高亮的格子落子</p>
            </div>
          </div>

          <!-- 难度选择 -->
          <div class="backdrop-blur-xl bg-glass border border-glass-border rounded-2xl p-4">
            <label class="text-[10px] uppercase tracking-wider text-text-secondary block mb-2.5"
              >难度</label
            >
            <div class="relative">
              <select
                class="w-full appearance-none bg-[rgba(255,255,255,0.04)] border border-glass-border rounded-lg py-2.5 pl-3 pr-8 text-xs text-text-primary outline-none focus:border-gold/40 cursor-pointer"
              >
                <option>L0 热身</option>
                <option>L1 入门</option>
                <option>L2 简单</option>
                <option selected>L3 中等</option>
                <option>L4 困难</option>
                <option>L5 专家</option>
              </select>
              <i
                data-lucide="chevron-down"
                class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-text-secondary pointer-events-none"
              ></i>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="grid grid-cols-3 gap-2">
            <button
              class="group flex flex-col items-center gap-1.5 p-3 rounded-xl border border-glass-border bg-[rgba(255,255,255,0.02)] hover:border-amber-500/35 hover:bg-amber-500/5 transition-all"
            >
              <i data-lucide="lightbulb" class="w-4 h-4 text-amber-400"></i>
              <span
                class="text-[10px] font-medium text-text-secondary group-hover:text-amber-300 transition-colors"
                >提示</span
              >
            </button>
            <button
              class="group flex flex-col items-center gap-1.5 p-3 rounded-xl border border-glass-border bg-[rgba(255,255,255,0.02)] hover:border-cyan-500/35 hover:bg-cyan-500/5 transition-all"
            >
              <i data-lucide="undo-2" class="w-4 h-4 text-cyan-400"></i>
              <span
                class="text-[10px] font-medium text-text-secondary group-hover:text-cyan-300 transition-colors"
                >悔棋</span
              >
            </button>
            <button
              class="group flex flex-col items-center gap-1.5 p-3 rounded-xl border border-glass-border bg-[rgba(255,255,255,0.02)] hover:border-gold/35 hover:bg-gold/5 transition-all"
            >
              <i data-lucide="rotate-cw" class="w-4 h-4 text-gold"></i>
              <span
                class="text-[10px] font-medium text-text-secondary group-hover:text-gold transition-colors"
                >新对局</span
              >
            </button>
          </div>

          <!-- 练习小贴士 -->
          <div class="backdrop-blur-xl bg-glass border border-glass-border rounded-2xl p-4 mt-auto">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span class="text-[10px] uppercase tracking-wider text-text-secondary"
                >练习小贴士</span
              >
            </div>
            <p class="text-[11px] text-text-secondary leading-relaxed">
              开局别急着吃子——<span class="text-emerald-300">占角（A1/H1/A8/H8）</span
              >才是胜负手。角上的子永远不会被翻。
            </p>
          </div>
        </aside>
      </div>
    </main>

    <script>
      // 中盘局面示意；D3（row2,col3 = index 19）为最后一手
      const POS = '....B.....BBW....BBWW....BWWBW..BBWBBW....BWWBW....BBW........'
      const LAST = 19
      const LEGAL = new Set([10, 11, 12, 26, 27, 42]) // 示意合法手
      const el = document.getElementById('local-board')
      el.innerHTML = POS.split('')
        .map((c, i) => {
          let inner = ''
          if (c === 'B')
            inner =
              '<div class="w-[76%] h-[76%] rounded-full stone-b' +
              (i === LAST ? '" style="animation:lastGlow 2.2s ease-in-out infinite;' : '') +
              '"></div>'
          else if (c === 'W') inner = '<div class="w-[76%] h-[76%] rounded-full stone-w"></div>'
          const legal = LEGAL.has(i) && c === '.' ? ' legal' : ''
          return (
            '<div class="board-cell' +
            legal +
            ' flex items-center justify-center">' +
            inner +
            '</div>'
          )
        })
        .join('')
      lucide.createIcons()
    </script>
  </body>
</html>

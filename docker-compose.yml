services:
  postgres:
    image: postgres:18
    container_name: othello-postgres
    environment:
      POSTGRES_USER: othello
      POSTGRES_PASSWORD: othello
      POSTGRES_DB: othello
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U othello']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://unpkg.com" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      * {
        scrollbar-width: none;
        scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
      }
    </style>
  </head>

  <body
    class="bg-[#0f1117] min-h-screen flex items-center justify-center relative overflow-hidden"
    style="font-family: 'DM Sans', system-ui, sans-serif"
  >
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #0f1117;
        --color-board-green: #1a6b3c;
        --color-board-dark: #145a30;
        --color-gold: #d4a843;
        --color-gold-light: #e8c96a;
        --color-glass: rgba(255, 255, 255, 0.05);
        --color-glass-border: rgba(255, 255, 255, 0.1);
        --color-text-primary: #f0f0f0;
        --color-text-secondary: #8a8f98;
        --color-surface: #161922;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(1deg);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% center;
        }
        100% {
          background-position: 200% center;
        }
      }

      @keyframes pulse-gold {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(212, 168, 67, 0.3);
        }
        50% {
          box-shadow: 0 0 40px rgba(212, 168, 67, 0.6);
        }
      }

      @keyframes glow-play {
        0%,
        100% {
          box-shadow:
            0 0 24px rgba(212, 168, 67, 0.4),
            0 4px 20px rgba(212, 168, 67, 0.3);
        }
        50% {
          box-shadow:
            0 0 48px rgba(212, 168, 67, 0.7),
            0 8px 40px rgba(212, 168, 67, 0.5);
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    />

    <!-- Decorative grid background -->
    <div class="absolute inset-0 opacity-[0.04]">
      <div
        class="w-full h-full"
        style="
          background-image:
            linear-gradient(rgba(26, 107, 60, 0.8) 1px, transparent 1px),
            linear-gradient(90deg, rgba(26, 107, 60, 0.8) 1px, transparent 1px);
          background-size: 80px 80px;
        "
      ></div>
    </div>

    <!-- Decorative chess pieces floating -->
    <div
      class="absolute top-[10%] left-[8%] w-16 h-16 rounded-full bg-gradient-to-br from-gray-900 to-black shadow-[0_4px_15px_rgba(0,0,0,0.8),inset_0_2px_4px_rgba(255,255,255,0.1)] opacity-20"
      style="animation: float 6s ease-in-out infinite"
    ></div>
    <div
      class="absolute top-[20%] right-[12%] w-12 h-12 rounded-full bg-gradient-to-br from-white to-gray-200 shadow-[0_4px_15px_rgba(0,0,0,0.5),inset_0_2px_4px_rgba(255,255,255,0.8)] opacity-15"
      style="animation: float 8s ease-in-out infinite 1s"
    ></div>
    <div
      class="absolute bottom-[15%] left-[15%] w-10 h-10 rounded-full bg-gradient-to-br from-white to-gray-300 shadow-[0_4px_12px_rgba(0,0,0,0.4),inset_0_2px_3px_rgba(255,255,255,0.9)] opacity-10"
      style="animation: float 7s ease-in-out infinite 2s"
    ></div>
    <div
      class="absolute bottom-[25%] right-[8%] w-14 h-14 rounded-full bg-gradient-to-br from-gray-800 to-black shadow-[0_4px_15px_rgba(0,0,0,0.8),inset_0_2px_4px_rgba(255,255,255,0.05)] opacity-15"
      style="animation: float 9s ease-in-out infinite 0.5s"
    ></div>

    <!-- Radial glow -->
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-[radial-gradient(circle,rgba(26,107,60,0.15)_0%,transparent_70%)]"
    ></div>

    <!-- Main login card -->
    <div class="relative z-10 w-full max-w-md px-8">
      <!-- Logo & Brand -->
      <div class="text-center mb-8">
        <!-- Othello board icon -->
        <div
          class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-[#1a6b3c] to-[#0d4a28] shadow-[0_8px_32px_rgba(26,107,60,0.3)] mb-5"
        >
          <div class="grid grid-cols-2 gap-1">
            <div
              class="w-5 h-5 rounded-full bg-black shadow-[inset_0_2px_4px_rgba(255,255,255,0.1)]"
            ></div>
            <div
              class="w-5 h-5 rounded-full bg-white shadow-[inset_0_-2px_4px_rgba(0,0,0,0.1)]"
            ></div>
            <div
              class="w-5 h-5 rounded-full bg-white shadow-[inset_0_-2px_4px_rgba(0,0,0,0.1)]"
            ></div>
            <div
              class="w-5 h-5 rounded-full bg-black shadow-[inset_0_2px_4px_rgba(255,255,255,0.1)]"
            ></div>
          </div>
        </div>
        <h1
          class="text-3xl font-bold text-text-primary tracking-wide"
          style="font-family: 'DM Sans', system-ui, sans-serif"
        >
          Othello · 黑白棋
        </h1>
        <!-- Brand tagline: 3 capsule tags -->
        <div class="flex items-center justify-center gap-2 mt-3">
          <span
            class="text-[10px] px-2.5 py-1 rounded-full bg-board-green/15 text-emerald-400 border border-board-green/30"
            style="font-family: 'DM Sans', system-ui, sans-serif"
            >零安装</span
          >
          <span
            class="text-[10px] px-2.5 py-1 rounded-full bg-gold/10 text-gold border border-gold/20"
            style="font-family: 'DM Sans', system-ui, sans-serif"
            >实时对战</span
          >
          <span
            class="text-[10px] px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20"
            style="font-family: 'DM Sans', system-ui, sans-serif"
            >多难度 AI</span
          >
        </div>
      </div>

      <!-- Play Now Button (AI offline - core CTA) -->
      <button
        class="w-full py-4 rounded-2xl font-bold text-lg text-[#0f1117] bg-gradient-to-r from-gold to-gold-light mb-5 hover:-translate-y-0.5 transition-all duration-300"
        style="
          font-family: 'DM Sans', system-ui, sans-serif;
          animation: glow-play 3s ease-in-out infinite;
        "
      >
        <i data-lucide="play" class="inline w-5 h-5 mr-2 -mt-1"></i>马上玩（人机离线）
      </button>

      <!-- Login Form Card -->
      <div
        class="backdrop-blur-xl bg-glass border border-glass-border rounded-2xl p-8 shadow-[0_8px_32px_rgba(0,0,0,0.4)]"
      >
        <div class="space-y-5">
          <!-- Username -->
          <div>
            <label
              class="block text-text-secondary text-xs uppercase tracking-wider mb-2"
              style="font-family: 'DM Sans', system-ui, sans-serif"
              >用户名</label
            >
            <div class="relative">
              <i
                data-lucide="user"
                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-text-secondary"
              ></i>
              <input
                type="text"
                placeholder="输入用户名"
                class="w-full bg-[rgba(255,255,255,0.03)] border border-glass-border rounded-xl py-3 pl-11 pr-4 text-text-primary placeholder:text-[#4a4f58] focus:outline-none focus:border-gold/50 transition-colors"
                style="font-family: 'DM Sans', system-ui, sans-serif"
              />
            </div>
          </div>
          <!-- Password -->
          <div>
            <label
              class="block text-text-secondary text-xs uppercase tracking-wider mb-2"
              style="font-family: 'DM Sans', system-ui, sans-serif"
              >密码</label
            >
            <div class="relative">
              <i
                data-lucide="lock"
                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-text-secondary"
              ></i>
              <input
                type="password"
                placeholder="输入密码"
                class="w-full bg-[rgba(255,255,255,0.03)] border border-glass-border rounded-xl py-3 pl-11 pr-4 text-text-primary placeholder:text-[#4a4f58] focus:outline-none focus:border-gold/50 transition-colors"
                style="font-family: 'DM Sans', system-ui, sans-serif"
              />
            </div>
          </div>
          <!-- Remember + Forgot -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
              <div
                class="w-4 h-4 rounded border border-glass-border bg-[rgba(255,255,255,0.03)] flex items-center justify-center"
              >
                <i data-lucide="check" class="w-2.5 h-2.5 text-gold"></i>
              </div>
              <span
                class="text-xs text-text-secondary"
                style="font-family: 'DM Sans', system-ui, sans-serif"
                >记住密码</span
              >
            </label>
            <a
              href="#"
              class="text-xs text-gold/70 hover:text-gold transition-colors"
              style="font-family: 'DM Sans', system-ui, sans-serif"
              >忘记密码？</a
            >
          </div>
          <!-- Login Button -->
          <button
            class="w-full py-3.5 rounded-xl font-semibold text-[#0f1117] bg-gradient-to-r from-gold to-gold-light shadow-[0_4px_20px_rgba(212,168,67,0.3)] hover:shadow-[0_6px_30px_rgba(212,168,67,0.5)] transition-all duration-300 hover:-translate-y-0.5"
            style="font-family: 'DM Sans', system-ui, sans-serif"
          >
            登 录
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center my-6">
          <div class="flex-1 h-px bg-glass-border"></div>
          <span class="px-4 text-text-secondary text-xs">OR</span>
          <div class="flex-1 h-px bg-glass-border"></div>
        </div>

        <!-- Guest mode -->
        <button
          class="w-full py-3 rounded-xl font-medium text-text-secondary border border-glass-border hover:border-text-secondary/30 hover:text-text-primary transition-all duration-300"
          style="font-family: 'DM Sans', system-ui, sans-serif"
        >
          <i data-lucide="zap" class="inline w-4 h-4 mr-2 -mt-0.5"></i>游客模式快速进入
        </button>

        <!-- Register link -->
        <p
          class="text-center mt-5 text-text-secondary text-sm"
          style="font-family: 'DM Sans', system-ui, sans-serif"
        >
          还没有账号？<a href="#" class="text-gold hover:text-gold-light transition-colors"
            >注册账号</a
          >
        </p>
      </div>

      <!-- Version -->
      <div class="flex items-center justify-center gap-3 mt-8">
        <p
          class="text-[#3a3f48] text-xs tracking-wider"
          style="font-family: 'DM Sans', system-ui, sans-serif"
        >
          v2.1.0 · Othello Online Platform
        </p>
      </div>
    </div>
  </body>
  <script>
    if (window.lucide) lucide.createIcons()
  </script>
</html>

name: Bug report
description: Report a bug to help us improve
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        For security vulnerabilities, do NOT use this form — see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output (server logs, browser console).
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which version or commit are you running?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, etc.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.

name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: 创建 GitHub Release（附自动生成 changelog）
  # ─────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
      skipped: ${{ steps.relcheck.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          set -euo pipefail
          CUR_VERSION="$(node -p "require('./package.json').version")"
          echo "current=$CUR_VERSION" >> "$GITHUB_OUTPUT"
          echo "LOG: Current version: $CUR_VERSION"

      - name: Check if GitHub Release already exists
        id: relcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.current }}"
          echo "LOG: Checking GitHub Release for tag: $TAG"

          set +e
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "LOG: Release exists for $TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "LOG: Release does not exist for $TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.relcheck.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.current }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.current }}
          generate_release_notes: true

  # ─────────────────────────────────────────────────────────
  # Job 2: 构建并推送 Docker 镜像到 GHCR（matrix 并行）
  # ─────────────────────────────────────────────────────────
  build:
    needs: release
    if: needs.release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile.server
          - image: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize image name (lowercase)
        id: image
        run: |
          set -euo pipefail
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=$REPO/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "LOG: Image: ${{ env.REGISTRY }}/$REPO/${{ matrix.image }}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image tag already exists
        id: imgcheck
        run: |
          set -euo pipefail
          REF="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}"

          echo "LOG: Checking image manifest: $REF"

          set +e
          docker manifest inspect "$REF" >/dev/null 2>&1
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "LOG: Image tag exists: $REF"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "LOG: Image tag does not exist: $REF"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if image already exists
        if: steps.imgcheck.outputs.exists == 'true'
        run: |
          echo "LOG: ${{ matrix.image }} image already exists for version ${{ needs.release.outputs.version }}. Nothing to do."
          exit 0

      - name: Set up QEMU
        if: steps.imgcheck.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.imgcheck.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        if: steps.imgcheck.outputs.exists != 'true'
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          VER="${{ needs.release.outputs.version }}"

          # 精确版本号 + latest 移动标签
          TAGS="$IMAGE:$VER"$'\n'"$IMAGE:latest"

          { echo "list<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "LOG: Tags:"
          echo "$TAGS"

      - name: Build and push image
        if: steps.imgcheck.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
